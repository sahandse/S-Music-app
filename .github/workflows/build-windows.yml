name: Build Windows Desktop

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer + package Windows installer
        # No GH_TOKEN here on purpose: it makes electron-builder try to
        # auto-publish to GitHub and crash on update-info. The release upload
        # is handled by the ncipollo step below instead.
        run: npm run build

      - name: Verify packaged output
        id: out
        shell: bash
        run: |
          ls -la release || true
          INSTALLER=$(find release -maxdepth 1 -name "*.exe" | head -n 1)
          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"

