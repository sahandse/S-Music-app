name: Build Debug APK

on:
  push:
    branches:
      - session/agent_aebabead-b02d-483f-873d-1a9fef180d36
      - claude/music-app-fonts-q1foo3
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # Distribution happens via the release below; Actions-artifact uploads
      # were dropped because they exhaust the account's artifact storage quota.
      - name: Publish/update GitHub Release with APK
        uses: ncipollo/release-action@v1
        with:
          tag: latest-debug-build
          name: "S-Music App - Latest Debug Build"
          body: "Automatically built debug APK from the latest push to `${{ github.ref_name }}`. Commit: ${{ github.sha }}"
          artifacts: ${{ steps.apk.outputs.path }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
