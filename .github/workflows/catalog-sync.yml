name: Sync Music Catalog

on:
  schedule:
    # GitHub throttles cron heavily, so we ask often to lower the average delay.
    - cron: '*/5 * * * *' # every 5 minutes (best-effort)
  workflow_dispatch:
    inputs:
      reset_offset:
        description: 'Re-read the pending Telegram queue from the start'
        type: boolean
        default: false
      poll_timeout:
        description: 'Long-poll seconds for getUpdates (run this right after posting)'
        default: '25'

permissions:
  contents: read

# Avoid overlapping runs (they share the getUpdates offset)
concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the sync script)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync catalog from Telegram channel to the public catalog repo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CATALOG_PAT: ${{ secrets.CATALOG_PAT }}
          CATALOG_REPO: sahandse/himusic-catalog
          CHANNEL: '@himusicapp'
          RESET_OFFSET: ${{ github.event.inputs.reset_offset == 'true' && '1' || '0' }}
          POLL_TIMEOUT: ${{ github.event.inputs.poll_timeout || '25' }}
        run: node tools/catalog-sync.js
