name: Sync Music Catalog

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes
  workflow_dispatch: {}

permissions:
  contents: read

# Avoid overlapping runs (they share the getUpdates offset)
concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the sync script)
        uses: actions/checkout@v4
        with:
          ref: claude/music-app-fonts-q1foo3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync catalog from Telegram channel to the public catalog repo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CATALOG_PAT: ${{ secrets.CATALOG_PAT }}
          CATALOG_REPO: sahandse/himusic-catalog
          CHANNEL: '@himusicapp'
        run: node tools/catalog-sync.js
